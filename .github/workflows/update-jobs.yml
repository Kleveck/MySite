name: Update Jobs Data
on:
  schedule:
    - cron: '0 9 * * *' # Corre todos os dias às 09:00
  workflow_dispatch: # Permite correr manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas playwright
          playwright install chromium

      - name: Run Scraper
        run: python Scraper/scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add src/vagas.json Scraper/jobs.csv
          git commit -m "Auto-update jobs" || exit 0
          git push